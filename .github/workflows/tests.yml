name: CI Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  core-algorithm-tests:
    name: Core Algorithm Tests & Demo (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Clean Environment (Zero External Dependencies)
        run: |
          echo "Verifying Python environment..."
          python --version
          echo "Installed pip packages before testing (should only contain pip/setuptools/wheel):"
          pip list

      - name: Run Unit Test Suite (Zero Dependencies)
        run: |
          echo "Executing: python -m unittest discover -s tests -v"
          python -m unittest discover -s tests -v

      - name: Run Direct Test Runner Script
        run: |
          echo "Executing: python tests/run_tests.py"
          python tests/run_tests.py

      - name: Execute CLI Alignment Demonstration
        run: |
          echo "Executing: python examples/demo_alignment.py"
          python examples/demo_alignment.py

  optional-apps-smoke-test:
    name: Optional Web & GUI Applications Smoke Test
    runs-on: ubuntu-latest
    needs: core-algorithm-tests

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bytecode Compilation Check (All Source Files)
        run: |
          echo "Compiling all Python modules to verify syntax integrity..."
          python -m py_compile src/algorithms/needleman_wunsch.py
          python -m py_compile src/algorithms/smith_waterman.py
          python -m py_compile src/web/app_streamlit.py
          python -m py_compile src/gui/app_kivy.py
          python -m py_compile examples/demo_alignment.py
          echo "All Python source files passed bytecode compilation without syntax errors."

      - name: Install Web Application Dependencies
        run: |
          echo "Installing Streamlit, Requests, and Pandas for web application smoke-test..."
          python -m pip install --upgrade pip
          pip install streamlit requests pandas

      - name: Web Application Import & API Module Smoke Test
        run: |
          echo "Validating Streamlit application imports and EBI REST API functions..."
          python -c "import streamlit, requests, pandas; print('Web dependencies successfully loaded.')"
          python -c "from src.web.app_streamlit import submit_clustalo_job, check_clustalo_status, get_clustalo_results; print('Streamlit app module and EBI REST client functions loaded successfully.')"

      - name: GUI Application (Kivy) Headless Smoke Test
        run: |
          echo "Testing Kivy desktop application imports in headless CI..."
          echo "Note: Kivy desktop GUI requires an active display server (X11/Wayland/Windows Desktop) for interactive rendering."
          python -m pip install "kivy>=2.2.0"
          python -c "
          import os
          os.environ['KIVY_NO_CONSOLELOG'] = '1'
          os.environ['KIVY_WINDOW'] = 'headless'
          try:
              import kivy
              from src.gui.app_kivy import HomePage, GlobalAlignmentPage, LocalAlignmentPage, SettingsPage, SeqAlignApp
              print(f'Kivy v{kivy.__version__} and SeqAlign+ screens imported successfully.')
          except Exception as e:
              print(f'Kivy import note (display server requirement): {e}')
          "
